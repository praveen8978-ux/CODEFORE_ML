<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codeforces problem recommender</title>
<style>
  :root { --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --line:#e2e2e2; --accent:#2a5bd7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#ececec; --muted:#9aa0a6; --line:#2b2f36; --accent:#7aa2ff; } }
  body { font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); margin:0; }
  main { max-width:760px; margin:0 auto; padding:40px 20px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  form { display:flex; gap:8px; margin-bottom:20px; }
  input { flex:1; padding:10px 12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
  button { padding:10px 18px; font-size:1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:.85rem; }
  a { color:var(--accent); text-decoration:none; }
  .tag { display:inline-block; font-size:.75rem; color:var(--muted); border:1px solid var(--line); border-radius:99px; padding:1px 8px; margin:2px 4px 0 0; }
  #status { color:var(--muted); margin:12px 0; min-height:1.5em; }
</style>
</head>
<body>
<main>
  <h1>Codeforces problem recommender</h1>
  <p class="sub">Enter a handle to get problems matched to your level and topics.</p>
  <form id="f">
    <input id="handle" placeholder="Codeforces handle" autocomplete="off" required>
    <button id="go">Recommend</button>
  </form>
  <div id="status"></div>
  <table id="out" hidden>
    <thead><tr><th>Problem</th><th>Rating</th><th>Tags</th></tr></thead>
    <tbody></tbody>
  </table>
</main>
<script>
const f = document.getElementById('f'), status = document.getElementById('status');
const out = document.getElementById('out'), body = out.querySelector('tbody'), go = document.getElementById('go');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  const handle = document.getElementById('handle').value.trim();
  go.disabled = true; out.hidden = true;
  status.textContent = 'Fetching your submissions from Codeforces (this takes a few seconds)...';
  try {
    const r = await fetch('/recommend/' + encodeURIComponent(handle));
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || 'Request failed');
    body.replaceChildren();
    for (const p of data.recommendations) {
      const tr = document.createElement('tr');
      const a = document.createElement('a'); a.href = p.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = p.name;
      const td1 = document.createElement('td'); td1.append(a);
      const td2 = document.createElement('td'); td2.textContent = p.rating;
      const td3 = document.createElement('td');
      for (const t of p.tags) { const s = document.createElement('span'); s.className = 'tag'; s.textContent = t; td3.append(s); }
      tr.append(td1, td2, td3); body.append(tr);
    }
    out.hidden = false;
    const rating = data.rating_estimated ? `estimated rating ${data.rating}` : `rating ${data.rating}`;
    status.textContent = `${data.handle} (${rating}, ${data.solved} solved). Model time: ${data.inference_ms} ms.` + (data.warning ? ' Note: ' + data.warning : '');
  } catch (err) {
    status.textContent = err.message;
  } finally { go.disabled = false; }
});
</script>
</body>
</html>
